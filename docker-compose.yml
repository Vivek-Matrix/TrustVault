services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: trustvault
      POSTGRES_USER: trustvault_app
      POSTGRES_PASSWORD: local_only
    ports:
      - "55432:5432"
    volumes:
      - trustvault-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trustvault_app -d trustvault"]
      interval: 5s
      timeout: 5s
      retries: 10
  converter:
    build:
      context: .
      dockerfile: backend/TrustVault.Converter/Dockerfile
    expose:
      - "8080"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=128m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 64
    mem_limit: 768m
    cpus: 1.0
    networks:
      - converter-private
  converter-dev-proxy:
    image: nginx:1.29-alpine
    depends_on:
      - converter
    entrypoint: ["nginx"]
    command: ["-g", "daemon off;"]
    user: "101:101"
    ports:
      - "127.0.0.1:6100:8080"
    volumes:
      - ./backend/TrustVault.Converter/nginx.conf:/etc/nginx/nginx.conf:ro
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 32
    mem_limit: 64m
    cpus: 0.25
    networks:
      - converter-private
      - converter-proxy-ingress

volumes:
  trustvault-postgres:

networks:
  converter-private:
    internal: true
  converter-proxy-ingress:
    driver: bridge

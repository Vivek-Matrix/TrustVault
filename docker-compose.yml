services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: trustvault
      POSTGRES_USER: trustvault_app
      POSTGRES_PASSWORD: local_only
    ports:
      - "5432:5432"
    volumes:
      - trustvault-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trustvault_app -d trustvault"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  trustvault-postgres:
